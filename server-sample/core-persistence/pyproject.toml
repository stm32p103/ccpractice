[project]
name = "job-core-persistence"
version = "0.1.0"
description = "コアのポートの永続化の実装(SQLAlchemy 2.0 + PostgreSQL)"
requires-python = ">=3.12"
dependencies = ["job-core", "job-core-api", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.13"]

[tool.uv.sources]
job-core = { workspace = true }
job-core-api = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "job_core_persistence"
