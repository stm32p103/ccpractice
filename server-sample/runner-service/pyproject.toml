[project]
name = "job-runner-service"
version = "0.1.0"
description = "ランナーエージェントの組み立てと起動の入口(Windows サービスから起動される)"
requires-python = ">=3.12"
dependencies = ["job-runner-agent", "job-profile-equipment-check"]

[tool.uv.sources]
job-runner-agent = { workspace = true }
job-profile-equipment-check = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "job_runner_service"
